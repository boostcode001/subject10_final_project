{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Vision Action{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'home' %}">Vision Action</a>
        <nav class="topbar-nav">
            {% if user.is_authenticated %}
                <a href="{% url 'analyses:index' %}">분석</a>
                {% if user.is_staff %}
                    <a href="{% url 'dashboard' %}">대시보드</a>
                    <a href="{% url 'admin:index' %}">관리자</a>
                {% endif %}
                <span class="topbar-user">{{ user.username }}님</span>
                <form action="{% url 'logout' %}" method="post" class="inline-form">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-ghost">로그아웃</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">로그인</a>
                <a href="{% url 'signup' %}">회원가입</a>
            {% endif %}
        </nav>
    </header>
    <main class="page">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
